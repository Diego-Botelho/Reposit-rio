<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cronômetro de Prova Online</title>
</head>
<body>
    <h2>Cronômetro de Prova</h2>
    <h1 id="display">00:00</h1>
    <button onclick="iniciar()">Iniciar</button>
    <button onclick="pausar()">Pausar</button>
    <button onclick="resetar()">Resetar</button>

    <script>
        let tempoTotalSegundos = 0;
        let intervalo = null;

        function atualizarDOM() {
            const minutos = Math.floor(tempoTotalSegundos / 60);
            const segundos = tempoTotalSegundos % 60;

            const mFormatado = minutos < 10 ? '0' + minutos : minutos;
            const sFormatado = segundos < 10 ? '0' + segundos : segundos;

            document.getElementById('display').innerText = `${mFormatado}:${sFormatado}`;
        }

        function iniciar() {
            if (intervalo) return; // Evita múltiplos intervalos acumulados
            intervalo = setInterval(() => {
                tempoTotalSegundos++;
                atualizarDOM();
            }, 1000);
        }

        function pausar() {
            clearInterval(intervalo);
            intervalo = null;
        }

        function resetar() {
            pausar();
            tempoTotalSegundos = 0;
            atualizarDOM();
        }
    </script>
</body>
</html>
