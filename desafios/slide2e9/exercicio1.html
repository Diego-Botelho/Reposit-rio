<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Caixa de Mercado</title>
</head>
<body>
    <h2>Caixa de Mercado</h2>
    <input type="number" id="num1" placeholder="Valor 1">
    <input type="number" id="num2" placeholder="Valor 2">
    <button onclick="calcular()">Calcular</button>

    <h3>Resultados:</h3>
    <div id="soma">Soma: </div>
    <div id="subtracao">Subtração: </div>
    <div id="multiplicacao">Multiplicação: </div>
    <div id="divisao">Divisão: </div>

    <script>
        function calcular() {
            const n1 = Number(document.getElementById('num1').value);
            const n2 = Number(document.getElementById('num2').value);

            document.getElementById('soma').innerText = `Soma: ${n1 + n2}`;
            document.getElementById('subtracao').innerText = `Subtração: ${n1 - n2}`;
            document.getElementById('multiplicacao').innerText = `Multiplicação: ${n1 * n2}`;
            document.getElementById('divisao').innerText = `Divisão: ${n2 !== 0 ? (n1 / n2) : 'Divisão por zero inválida'}`;
        }
    </script>
</body>
</html>
